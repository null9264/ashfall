name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# 把所有 setup-node 都钉到 Node 22,actions 升 v5 解决 Node 20 deprecation 警告
jobs:
  vitest:
    name: 单元测试 (Unit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'

      - name: 安装依赖
        run: npm ci

      - name: 跑单元测试
        run: npm test

  build:
    name: 构建 (Build)
    runs-on: ubuntu-latest
    needs: vitest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'

      - run: npm ci
      - run: npm run build

  e2e:
    name: E2E 回归 (Cloudflare 生产环境)
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v5

      - name: 跑 E2E (默认 base URL)
        env:
          BASE: ${{ secrets.E2E_BASE_URL || 'https://ashfall-6mr.pages.dev' }}
        run: |
          BASE="$BASE" bash tests/e2e/regression.sh

  lint-ts:
    name: TypeScript 编译 (tsc)
    runs-on: ubuntu-latest
    needs: vitest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'

      - run: npm ci
      - name: 类型检查 functions
        run: npx tsc --noEmit -p tsconfig.test.json
      - name: 类型检查 src
        run: npx tsc --noEmit
